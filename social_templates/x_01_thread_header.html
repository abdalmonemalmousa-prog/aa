:root{--navy:#0B1F3A;--navy2:#132B4F;--gold:#C9A227;--gold2:#E6C766;--ivory:#FBF8F1;--soft:#F1EBDC;--ink:#1C2430;--muted:#6B7382}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;overflow:hidden;direction:rtl;font-family:'Tajawal','Cairo',sans-serif;color:var(--ink);background:#fff}
.card{position:relative;width:1600px;height:900px;overflow:hidden}
.dark{background:var(--navy);color:#fff}
.light{background:var(--ivory);color:var(--ink)}
.frame:before{content:"";position:absolute;inset:34px;border:1.5px solid rgba(201,162,39,.5);pointer-events:none}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(201,162,39,.22),rgba(201,162,39,0));pointer-events:none}
.brand{position:absolute;display:flex;align-items:center;gap:16px;font-family:'Cairo';font-weight:700}
.mono{width:64px;height:64px;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:800;font-size:28px;color:var(--gold);letter-spacing:1px;direction:ltr}
.brand .nm{font-size:22px;line-height:1.2}
.brand .nm small{display:block;font-weight:500;font-size:14px;letter-spacing:2px;color:var(--gold2);direction:ltr;text-align:right}
.light .brand .nm{color:var(--navy)} .light .brand .nm small{color:var(--gold)}
.tag{display:inline-block;font-family:'Cairo';font-weight:700;font-size:22px;letter-spacing:1px;color:var(--navy);background:var(--gold);padding:8px 22px;border-radius:999px}
.tag.outline{background:transparent;color:var(--gold2);border:1.5px solid var(--gold)}
.light .tag.outline{color:var(--navy);border-color:var(--navy)}
h1{font-family:'Cairo';font-weight:800;line-height:1.3}
.rule{height:3px;width:120px;background:linear-gradient(90deg,var(--gold),transparent)}
.foot{position:absolute;bottom:44px;right:70px;left:70px;display:flex;justify-content:space-between;align-items:center;font-size:20px;color:rgba(255,255,255,.7);border-top:1px solid rgba(201,162,39,.4);padding-top:18px}
.light .foot{color:var(--muted);border-top-color:rgba(11,31,58,.18)}
.foot .h{direction:ltr;font-family:'Cairo';font-weight:600;color:var(--gold2)} .light .foot .h{color:var(--navy)}
.disc{font-size:16px;opacity:.75}
ul.pts{list-style:none}
ul.pts li{position:relative;padding-right:46px;margin-bottom:22px;font-size:30px;line-height:1.5}
ul.pts li:before{content:"";position:absolute;right:0;top:16px;width:22px;height:22px;border-radius:50%;background:var(--gold)}
.photo{position:absolute;border:2px dashed rgba(201,162,39,.7);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--gold2);font-size:20px;line-height:1.6;background:rgba(255,255,255,.04)}
.light .photo{color:var(--navy);background:rgba(11,31,58,.04);border-color:rgba(11,31,58,.35)}
.num{font-family:'Cairo';font-weight:800;color:var(--gold);line-height:1}
</style></head><body>

r:var(--gold2);background:transparent">9</div><div style="height:64px;border:1.5px solid var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:Cairo;font-weight:800;font-size:26px;color:var(--gold2);background:transparent">10</div>
